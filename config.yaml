debug: false
truenas:
  method: api
  api_transport: auto
  host: ${TRUENAS_HOST:-192.168.1.10}
  api_url: ${TRUENAS_API_URL:-https://192.168.1.10}
  api_key: ${TRUENAS_API_KEY}
  verify_ssl: false
  hdd_only: true
  user: ${TRUENAS_USER:-admin}
  key_path: /root/.ssh/id_ed25519
  timeout_sec: 8
  drives: []
  fail_threshold: 3
  poll_temps_sec: 15
  poll_metrics_sec: 30
fan:
  pwm_channel: pwm2
  driver_match: it87
  floor_pct: 40
  floor_pwm: 102
  ceiling_pct: 72
  ceiling_pwm: 184
  emergency_pwm: 255
  safe_pwm: 102
  pwm_enable_mode: 1
temps_c:
  cool: 36
  warm: 40
  hot: 45
  critical: 52
  hysteresis: 1.5
timing:
  interval_sec: 30
  step_up_pwm: 12
  step_down_pwm: 6
  cooldown_down_sec: 300
  max_boost_sec: 1200
  heartbeat_file: /run/smart-nas-fan/heartbeat
  override_file: /run/smart-nas-fan/override.json
  log_file: /var/log/smart-nas-fan.log
  jsonl_file: /var/log/smart-nas-fan.jsonl
  db_file: /var/log/smart-nas-fan.db
manual:
  enabled: true
  max_sec: 1800
  min_pwm: 102
mqtt:
  enabled: true
  broker: ${MQTT_BROKER:-192.168.1.5}
  port: 1883
  username: ${MQTT_USER}
  password: ${MQTT_PASSWORD}
  base: smart-nas-fan
  retain: true
ntfy:
  enabled: true
  url: ${NTFY_URL}
  on_step_up: true
  on_step_down: false
  on_failsafe: true
  on_critical: true
  on_api_fail: true
  on_recovery: true
weather:
  enabled: true
  postcode: '33333'
  country: United States
  latitude:
  longitude:
sensors:
  enabled: true
  topic: zigbee2mqtt/0xa4c1380ac08fffff
  temp_key: temperature
  humidity_key: humidity
  plug_topic:
  power_key: power
  energy_key: energy
