# smart-nas-fan / docker-compose.yml
# Three services: controller + watchdog (fan control, privileged, /sys rw)
# + admin (neon control center on 0.0.0.0:6767, no privileged needed).
# Fan control must run on the Proxmox host (or host with hwmon passthrough).
#
# Layout on Docker host:
#   ./config.yaml          -> your edited config (controller:ro, admin:rw for editor)
#   ~/.ssh/                -> SSH keys for TrueNAS fallback (mounted read-only)
#   ./logs/                -> smart-nas-fan.log + smart-nas-fan.jsonl + smart-nas-fan.db (persisted)
#   heartbeat volume       -> shared /run/smart-nas-fan between all containers
#
# Secrets live in `.env` (copy `.env.example`), NEVER in this file.
# Compose auto-loads `./.env`. Start:
#   cp .env.example .env && nano .env   # fill secrets first!
#   docker compose up -d --build
# Logs:   docker compose logs -f controller
#         docker compose logs -f watchdog
# UI:     http://<host>:6767  (login with ADMIN_USER / ADMIN_PASS from .env)

services:
  controller:
    build: .
    image: smart-nas-fan:latest
    container_name: smart-nas-fan-controller
    command: ["python", "fan_controller.py"]
    privileged: true
    restart: unless-stopped
    environment:
      NASTEMP_CONFIG: /config/config.yaml
      # Secrets from .env (see .env.example) — expanded inside config.yaml:
      TRUENAS_HOST: ${TRUENAS_HOST:-}
      TRUENAS_API_URL: ${TRUENAS_API_URL:-}
      TRUENAS_API_KEY: ${TRUENAS_API_KEY:-}
      TRUENAS_USER: ${TRUENAS_USER:-}
      MQTT_BROKER: ${MQTT_BROKER:-}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      NTFY_URL: ${NTFY_URL:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ~/.ssh:/root/.ssh:ro
      - ./logs:/var/log
      - heartbeat:/run/smart-nas-fan
      - /sys/class/hwmon:/sys/class/hwmon:rw

  watchdog:
    image: smart-nas-fan:latest
    container_name: smart-nas-fan-watchdog
    command: ["python", "watchdog.py"]
    privileged: true
    restart: unless-stopped
    environment:
      NASTEMP_HEARTBEAT: /run/smart-nas-fan/heartbeat
      NASTEMP_SAFE_PWM: ${SAFE_PWM:-102}
      NASTEMP_STALE_SEC: ${STALE_SEC:-300}
      NASTEMP_PWM: ${PWM_CHANNEL:-pwm2}
      NTFY_URL: ${NTFY_URL:-}
      # Watchdog pushes via NTFY_URL (falls back to NASTEMP_NTFY if you set that instead).
      TZ: ${TZ:-UTC}
    volumes:
      - ./logs:/var/log
      - heartbeat:/run/smart-nas-fan
      # watchdog finds pwm via /sys, so it needs the same sysfs bind:
      - /sys/class/hwmon:/sys/class/hwmon:rw

    # NOTE: /sys is mounted automatically read-only in most Docker setups.
    # privileged:true + this explicit rw bind is what allows `echo 102 > pwm2`.
    # If your platform blocks /sys writes, use the native systemd install instead.

  admin:
    build: ./admin
    image: smart-nas-fan-admin:latest
    container_name: smart-nas-fan-admin
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      NASTEMP_CONFIG: /config/config.yaml
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?set ADMIN_PASS in .env (no default password)}
      TRUENAS_API_KEY: ${TRUENAS_API_KEY:-}
      # Remote mode (GUI on another VM/host, Proxmox reached over IP via SSH key):
      # Set these in .env instead of editing here:
      # PROXMOX_HOST, PROXMOX_USER, PROXMOX_PORT, PROXMOX_KEY, PROXMOX_CONFIG
      TZ: ${TZ:-UTC}
    volumes:
      # rw so the UI config editor can save (controller mounts the same file ro):
      - ./config.yaml:/config/config.yaml:rw
      - ./logs:/var/log:ro
      # rw: UI writes manual fan override (/run/smart-nas-fan/override.json), reads heartbeat:
      - heartbeat:/run/smart-nas-fan:rw
      # ro: live fan read for the animated 🌀 (no privileged needed):
      - /sys/class/hwmon:/sys/class/hwmon:ro
      # For remote mode only: key to reach Proxmox over SSH:
      # - ~/.ssh:/root/.ssh:ro

volumes:
  heartbeat:
