# smart-nas-fan / Home Assistant MQTT sensors
# Paste into configuration.yaml (or include). Requires Mosquitto broker + MQTT integration.
# Topics come from fan_controller.py with base "smart-nas-fan".
# History DB = HA recorder (default). For long history add: recorder: purge_keep_days: 30
mqtt:
  sensor:
    - name: "NAS HDD Max Temp"
      unique_id: smart_nas_fan_hdd_max
      state_topic: "smart-nas-fan/hdd/max_temp"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
    - name: "NAS HDD Avg Temp"
      unique_id: smart_nas_fan_hdd_avg
      state_topic: "smart-nas-fan/hdd/avg_temp"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
    - name: "NAS Fan PWM"
      unique_id: smart_nas_fan_fan_pwm
      state_topic: "smart-nas-fan/fan/pwm"
      state_class: measurement
    - name: "NAS Fan Speed"
      unique_id: smart_nas_fan_fan_pct
      state_topic: "smart-nas-fan/fan/pct"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:fan
    - name: "NAS Fan RPM"
      unique_id: smart_nas_fan_fan_rpm
      state_topic: "smart-nas-fan/fan/rpm"
      unit_of_measurement: "RPM"
      state_class: measurement
      icon: mdi:fan
    - name: "NAS Fan Target"
      unique_id: smart_nas_fan_fan_target
      state_topic: "smart-nas-fan/fan/target"
      state_class: measurement
    - name: "NAS Fan Mode"
      unique_id: smart_nas_fan_fan_mode
      state_topic: "smart-nas-fan/fan/mode"
      icon: mdi:account-cog
    - name: "NAS Fan Status"
      unique_id: smart_nas_fan_status
      state_topic: "smart-nas-fan/status"
    - name: "NAS Fan Event"
      unique_id: smart_nas_fan_event
      state_topic: "smart-nas-fan/event"
    - name: "NAS Controller Online"
      unique_id: smart_nas_fan_online
      state_topic: "smart-nas-fan/online"
    - name: "NAS Temp Source"
      unique_id: smart_nas_fan_source
      state_topic: "smart-nas-fan/hdd/source"
      icon: mdi:server-network
    - name: "NAS HDD Count"
      unique_id: smart_nas_fan_hdd_count
      state_topic: "smart-nas-fan/hdd/count"
      state_class: measurement

  # Per-drive temps: add one block per drive after first run
  # (topic smart-nas-fan/hdd/sda/temp etc. - check MQTT explorer)
  # Example:
  #   - name: "NAS HDD sda Temp"
  #     unique_id: smart_nas_fan_hdd_sda
  #     state_topic: "smart-nas-fan/hdd/sda/temp"
  #     unit_of_measurement: "°C"
  #     device_class: temperature
  #     state_class: measurement
